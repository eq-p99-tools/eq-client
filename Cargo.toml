[workspace]
members = [
  "apps/eq-client",
  "crates/eq-client-assets",
  "crates/eq-client-axes",
  "crates/eq-client-core",
  "crates/eq-client-render",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/eq-p99-tools/eq-client"
rust-version = "1.99"

[workspace.dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bevy = { version = "0.19.1", default-features = false, features = [
  "3d_bevy_render",
  "async_executor",
  "bevy_audio",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_winit",
  "default_font",
  "multi_threaded",
  "reflect_auto_register",
  "std",
  "wav",
  "x11",
] }
clap = { version = "4.5", features = ["derive", "env"] }
eq-client-assets = { path = "crates/eq-client-assets" }
eq-client-axes = { path = "crates/eq-client-axes" }
eq-client-core = { path = "crates/eq-client-core" }
eq-client-render = { path = "crates/eq-client-render" }
anyhow = "1"
eq-network = { git = "https://github.com/eq-p99-tools/eq-network", branch = "main" }
eq-network-game = { git = "https://github.com/eq-p99-tools/eq-network", branch = "main" }
glam = "0.32.1"
parry3d = "0.30.2"
rerecast = { version = "=0.4.0", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "ico", "jpeg", "png", "tga"] }
libeq = { git = "https://github.com/eq-p99-tools/libeq", rev = "e0e5a4e65c170272035a8beb65bda048f7a60a01" }
roxmltree = "0.21.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
rodio = { version = "0.22", default-features = false, features = ["hound"] }
thiserror = "2"
tracing = "0.1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
