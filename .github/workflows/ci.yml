name: CI

# The full suite runs only on demand (Actions > CI > Run workflow), at milestones.
# Pull requests and main run Lint; contributors run these checks locally.
# Temporary while development is heavy: the full suite returns to pull requests later.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Validation platform (Linux is an explicit deferred sweep)
        type: choice
        default: windows
        options:
          - windows
          - linux
      toolchain:
        description: Rust toolchain (1.99.0 is the routine minimum; stable is opt-in)
        required: false
        default: '1.99.0'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    if: inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The audio backend links ALSA even when tests do not open a device.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain || '1.99.0' }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    if: inputs.platform != 'linux'
    name: Native Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain || '1.99.0' }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
