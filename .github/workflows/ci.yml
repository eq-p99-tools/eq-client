name: CI

# The full suite runs only on demand (Actions > CI > Run workflow), at milestones.
# Pull requests and main run Lint; contributors run these checks locally.
# Temporary while development is heavy: the full suite returns to pull requests later.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to validate
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The audio backend links ALSA even when tests do not open a device.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  windows:
    if: inputs.platform != 'linux'
    name: Native Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
